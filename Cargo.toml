[package]
build = "src/build.rs"
name = "raidcall-history-decryptor"
version = "0.1.0"
edition = "2021"
description = "RaidCall encrypted SQLite .dat decryptor for Windows and Linux"
license = "MPL-2.0"

[dependencies]
sha1 = "0.10"
# Prefer Vulkan on Windows/Linux. Windows then tries D3D12 (including WARP)
# and compatible modern GL; Linux retains legacy Glow if no Vulkan adapter.
# wgpu 24 includes Vulkan/GLES on Windows/Linux through target-specific backends,
# while its "dx12" Cargo feature enables the Windows Direct3D backend.
eframe = { version = "0.31", optional = true, default-features = false, features = ["default_fonts", "persistence", "glow", "wgpu", "x11", "wayland"] }
egui-wgpu = { version = "0.31", optional = true }
wgpu = { version = "24", optional = true, features = ["dx12"] }
rfd = { version = "0.15", optional = true }

[build-dependencies]
winresource = "0.1"

[features]
default = []
gui = ["dep:eframe", "dep:rfd", "dep:egui-wgpu", "dep:wgpu"]

[[bin]]
name = "rc-dat-decrypt"
path = "src/main.rs"

[[bin]]
name = "raidcall-gui"
path = "src/bin/raidcall_gui.rs"
required-features = ["gui"]
